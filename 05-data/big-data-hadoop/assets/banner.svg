<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">Big Data and Hadoop</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:#f6f8fa;stroke:#d0d7de}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.accent{fill:#0b7a83}
.chip{fill:#0b7a83;fill-opacity:0.08;stroke:#0b7a83;stroke-opacity:.45}
.deco{fill:none;stroke:#0b7a83;stroke-opacity:.13}
@media (prefers-color-scheme: dark){
.card{fill:#161b22;stroke:#30363d}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.accent{fill:#39c5cf}
.chip{fill:#39c5cf;fill-opacity:0.14;stroke:#39c5cf;stroke-opacity:.5}
.deco{stroke:#39c5cf;stroke-opacity:.16}
}
</style>
<defs><clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath></defs>
<rect class="card" x="1" y="1" width="1198" height="298" rx="18" stroke-width="2"/>
<g clip-path="url(#clip)">
<rect class="accent" x="0" y="0" width="12" height="300"/>
<g class="deco" stroke-width="2"><circle cx="1150" cy="300" r="70"/><circle cx="1150" cy="300" r="115"/><circle cx="1150" cy="300" r="160"/><circle cx="1150" cy="300" r="205"/></g>
</g>
<text class="muted" x="64" y="62" font-size="20" font-weight="600" letter-spacing=".3">REVA University · B.Tech CSE · 2020</text>
<text class="fg" x="64" y="134" font-size="46" font-weight="700">Big Data and Hadoop</text>
<text class="accent mono" x="64" y="180" font-size="20" font-weight="500">Hadoop 3.x · Java MapReduce · Python streaming · Spark 2.4</text>
<g font-size="18" font-weight="500">
<rect class="chip" x="64.0" y="222" width="90.0" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="109.0" y="248.5" text-anchor="middle">HDFS</text>
<rect class="chip" x="166.0" y="222" width="147.2" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="239.6" y="248.5" text-anchor="middle">MapReduce</text>
<rect class="chip" x="325.2" y="222" width="78.1" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="364.3" y="248.5" text-anchor="middle">Hive</text>
<rect class="chip" x="415.4" y="222" width="98.6" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="464.7" y="248.5" text-anchor="middle">HBase</text>
<rect class="chip" x="526.0" y="222" width="88.9" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="570.5" y="248.5" text-anchor="middle">Spark</text>
</g>
</svg>
