# flume agent a1 : spooldir source -> memory channel -> hdfs sink
# run: flume-ng agent -n a1 -c conf -f flume_agent.conf -Dflume.root.logger=INFO,console

# name the components
a1.sources = src1
a1.channels = ch1
a1.sinks = sink1

# source - read files dropped into a spool directory
a1.sources.src1.type = spooldir
a1.sources.src1.spoolDir = /home/hadoop/flume_spool
a1.sources.src1.fileHeader = true
a1.sources.src1.channels = ch1

# channel - in memory buffer
a1.channels.ch1.type = memory
a1.channels.ch1.capacity = 10000
a1.channels.ch1.transactionCapacity = 1000

# sink - write to HDFS
a1.sinks.sink1.type = hdfs
a1.sinks.sink1.channel = ch1
a1.sinks.sink1.hdfs.path = hdfs://localhost:9000/user/hadoop/flume/%Y-%m-%d
a1.sinks.sink1.hdfs.filePrefix = log
a1.sinks.sink1.hdfs.fileType = DataStream
a1.sinks.sink1.hdfs.writeFormat = Text
a1.sinks.sink1.hdfs.rollInterval = 60
a1.sinks.sink1.hdfs.rollSize = 134217728
a1.sinks.sink1.hdfs.rollCount = 0
a1.sinks.sink1.hdfs.useLocalTimeStamp = true
