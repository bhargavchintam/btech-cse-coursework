<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">Advanced Computer Programming and Lab</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:#f6f8fa;stroke:#d0d7de}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.accent{fill:#0969da}
.chip{fill:#0969da;fill-opacity:0.08;stroke:#0969da;stroke-opacity:.45}
.deco{fill:none;stroke:#0969da;stroke-opacity:.13}
@media (prefers-color-scheme: dark){
.card{fill:#161b22;stroke:#30363d}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.accent{fill:#58a6ff}
.chip{fill:#58a6ff;fill-opacity:0.14;stroke:#58a6ff;stroke-opacity:.5}
.deco{stroke:#58a6ff;stroke-opacity:.16}
}
</style>
<defs><clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath></defs>
<rect class="card" x="1" y="1" width="1198" height="298" rx="18" stroke-width="2"/>
<g clip-path="url(#clip)">
<rect class="accent" x="0" y="0" width="12" height="300"/>
<g class="deco" stroke-width="2"><circle cx="1150" cy="300" r="70"/><circle cx="1150" cy="300" r="115"/><circle cx="1150" cy="300" r="160"/><circle cx="1150" cy="300" r="205"/></g>
</g>
<text class="muted" x="64" y="62" font-size="20" font-weight="600" letter-spacing=".3">REVA University · B.Tech CSE · 2018</text>
<text class="fg" x="64" y="134" font-size="46" font-weight="700">Advanced Computer Programming and Lab</text>
<text class="accent mono" x="64" y="180" font-size="20" font-weight="500">Java · plain JDK · javac</text>
<g font-size="18" font-weight="500">
<rect class="chip" x="64.0" y="222" width="138.6" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="133.3" y="248.5" text-anchor="middle">Inheritance</text>
<rect class="chip" x="214.6" y="222" width="112.7" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="270.9" y="248.5" text-anchor="middle">Threads</text>
