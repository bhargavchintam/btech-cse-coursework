<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <title>pricing</title>
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="text-center mb-4">Our Plans</h2>
      <div class="row">
        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-header text-center">Basic</div>
            <div class="card-body text-center">
              <h3 class="card-title">1000</h3>
              <ul class="list-unstyled">
                <li>10 classes</li>
                <li>1 project</li>
                <li>Email support</li>
              </ul>
              <a href="#" class="btn btn-outline-primary">Choose</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card mb-3 border-primary">
            <div class="card-header text-center bg-primary text-white">Standard</div>
            <div class="card-body text-center">
              <h3 class="card-title">2000</h3>
              <ul class="list-unstyled">
                <li>20 classes</li>
                <li>3 projects</li>
                <li>Phone support</li>
              </ul>
              <a href="#" class="btn btn-primary">Choose</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-header text-center">Premium</div>
            <div class="card-body text-center">
              <h3 class="card-title">3500</h3>
              <ul class="list-unstyled">
                <li>Unlimited classes</li>
                <li>5 projects</li>
                <li>Certificate</li>
              </ul>
              <a href="#" class="btn btn-outline-primary">Choose</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js" integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T" crossorigin="anonymous"></script>
  </body>
</html>
