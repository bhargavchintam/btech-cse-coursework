<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <title>carousel</title>
  </head>
  <body>
    <div class="container mt-3">
      <h2 class="mb-3">Slideshow</h2>
      <div id="slider1" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#slider1" data-slide-to="0" class="active"></li>
          <li data-target="#slider1" data-slide-to="1"></li>
          <li data-target="#slider1" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <div style="height:320px; background:#4285f4;"></div>
            <div class="carousel-caption d-none d-md-block">
              <h5>Welcome</h5>
              <p>Summer coding camp 2018.</p>
            </div>
          </div>
          <div class="carousel-item">
            <div style="height:320px; background:#0f9d58;"></div>
            <div class="carousel-caption d-none d-md-block">
              <h5>Learn C and Java</h5>
              <p>Daily hands on practice.</p>
            </div>
          </div>
          <div class="carousel-item">
            <div style="height:320px; background:#db4437;"></div>
            <div class="carousel-caption d-none d-md-block">
              <h5>Build Projects</h5>
              <p>Make your own website.</p>
            </div>
          </div>
        </div>
        <a class="carousel-control-prev" href="#slider1" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#slider1" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js" integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T" crossorigin="anonymous"></script>
  </body>
</html>
