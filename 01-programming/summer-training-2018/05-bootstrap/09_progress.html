<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <title>progress</title>
  </head>
  <body>
    <div class="container mt-3">
      <h2>Progress Bars</h2>

      <p class="mb-1">HTML</p>
      <div class="progress mb-3">
        <div class="progress-bar" role="progressbar" style="width: 90%">90%</div>
      </div>

      <p class="mb-1">CSS</p>
      <div class="progress mb-3">
        <div class="progress-bar bg-success" role="progressbar" style="width: 75%">75%</div>
      </div>

      <p class="mb-1">JavaScript</p>
      <div class="progress mb-3">
        <div class="progress-bar bg-info progress-bar-striped" role="progressbar" style="width: 50%">50%</div>
      </div>

      <p class="mb-1">Bootstrap</p>
      <div class="progress mb-3">
        <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated" role="progressbar" style="width: 40%">40%</div>
      </div>

      <h2 class="mt-4">Badges</h2>
      <h4>Notifications <span class="badge badge-danger">7</span></h4>
      <span class="badge badge-primary">C</span>
      <span class="badge badge-success">Java</span>
      <span class="badge badge-secondary">Web</span>
      <span class="badge badge-pill badge-info">new batch</span>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js" integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T" crossorigin="anonymous"></script>
  </body>
</html>
