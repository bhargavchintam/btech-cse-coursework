<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <title>tabs and pills</title>
  </head>
  <body>
    <div class="container mt-3">
      <h2>Tabs</h2>
      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" data-toggle="tab" href="#home" role="tab">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-toggle="tab" href="#about" role="tab">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-toggle="tab" href="#contact" role="tab">Contact</a>
        </li>
      </ul>
      <div class="tab-content mt-2">
        <div class="tab-pane fade show active" id="home" role="tabpanel">
          <p>This is the home tab. Welcome to my page.</p>
        </div>
        <div class="tab-pane fade" id="about" role="tabpanel">
          <p>I am a second year student learning web design.</p>
        </div>
        <div class="tab-pane fade" id="contact" role="tabpanel">
          <p>Email me at student@example.com</p>
        </div>
      </div>

      <h2 class="mt-4">Pills</h2>
      <ul class="nav nav-pills" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" data-toggle="pill" href="#c" role="tab">C</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-toggle="pill" href="#java" role="tab">Java</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-toggle="pill" href="#web" role="tab">Web</a>
        </li>
      </ul>
      <div class="tab-content mt-2">
        <div class="tab-pane fade show active" id="c" role="tabpanel">
          <p>C programming basics and loops.</p>
        </div>
        <div class="tab-pane fade" id="java" role="tabpanel">
          <p>Java OOPs and classes.</p>
        </div>
        <div class="tab-pane fade" id="web" role="tabpanel">
          <p>HTML CSS and Bootstrap.</p>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js" integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T" crossorigin="anonymous"></script>
  </body>
</html>
