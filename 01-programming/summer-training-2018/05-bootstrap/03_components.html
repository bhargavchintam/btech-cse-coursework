<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <title>components</title>
  </head>
  <body>
    <div class="container">
      <h2 class="mt-3">Buttons</h2>
      <button type="button" class="btn btn-primary">Primary</button>
      <button type="button" class="btn btn-secondary">Secondary</button>
      <button type="button" class="btn btn-success">Success</button>
      <button type="button" class="btn btn-danger">Danger</button>
      <button type="button" class="btn btn-warning">Warning</button>
      <button type="button" class="btn btn-outline-primary">Outline</button>
      <button type="button" class="btn btn-success btn-lg">Large</button>
      <button type="button" class="btn btn-danger btn-sm">Small</button>

      <h2 class="mt-4">Badges</h2>
      <h4>Inbox <span class="badge badge-primary">4</span></h4>
      <span class="badge badge-success">new</span>
      <span class="badge badge-danger">hot</span>
      <span class="badge badge-pill badge-info">pill badge</span>

      <h2 class="mt-4">Alerts</h2>
      <div class="alert alert-success">Form submitted successfully.</div>
      <div class="alert alert-warning">Your session will expire soon.</div>
      <div class="alert alert-danger">Wrong password entered.</div>
      <div class="alert alert-info">New batch starts from Monday.</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js" integrity="sha384-smHYKdLADwkXOn1EmN1qk/HfnUcbVRZyYmZ4qpPea6sjB/pTJ0euyQp0Mk8ck+5T" crossorigin="anonymous"></script>
  </body>
</html>
