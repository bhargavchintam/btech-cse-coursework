<!DOCTYPE html>
<html>
<head>
    <title>click events</title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@16/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

    <script type="text/babel">
        class Buttons extends React.Component {
            constructor(props) {
                super(props);
                this.state = { msg: 'click a button' };
            }

            say(text) {
                this.setState({ msg: text });
            }

            render() {
                return (
                    <div>
                        <h2>{this.state.msg}</h2>
                        <button onClick={() => this.say('you said hi')}>Hi</button>
                        <button onClick={() => this.say('you said bye')}>Bye</button>
                        <button onClick={() => this.say('click a button')}>Reset</button>
                    </div>
                );
            }
        }

        ReactDOM.render(<Buttons />, document.getElementById('root'));
    </script>
</body>
</html>
