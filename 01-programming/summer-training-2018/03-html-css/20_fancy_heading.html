<!DOCTYPE html>
<html>
<head>
  <title>styled heading</title>
  <style>
    body {
      background-color: #1a1a2e;
      font-family: Georgia, serif;
    }
    h1 {
      color: #f39c12;
      text-align: center;
      font-size: 60px;
      letter-spacing: 4px;
      text-shadow: 2px 2px 4px #000;
      margin-top: 100px;
    }
    p {
      text-align: center;
      color: #ecf0f1;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Bhargav's Blog</h1>
  <p>cricket, movies and a bit of code</p>
</body>
</html>
