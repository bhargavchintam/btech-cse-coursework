<!DOCTYPE html>
<html>
<head>
    <title>iframe embed</title>
</head>
<body>
    <h2>Embedding With iframe</h2>
    <p>My portfolio page inside a frame:</p>
    <iframe src="portfolio.html" width="600" height="300"></iframe>
    <p>A cricket video from youtube:</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/9y8xnvFTr5w" frameborder="0" allowfullscreen></iframe>
</body>
</html>
