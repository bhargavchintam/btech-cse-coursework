<!DOCTYPE html>
<html>
<head>
  <title>footer</title>
  <style>
    body { margin: 0; font-family: Arial; }
    .content { padding: 30px; min-height: 300px; }
    footer {
      background-color: #222;
      color: #ccc;
      padding: 30px;
    }
    footer .cols {
      display: flex;
      justify-content: space-around;
    }
    footer h4 { color: white; }
    footer a { color: #ccc; text-decoration: none; display: block; }
    footer a:hover { color: white; }
    .bottom {
      text-align: center;
      border-top: 1px solid #444;
      margin-top: 20px;
      padding-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>My Website</h1>
    <p>scroll down to see the footer.</p>
  </div>
  <footer>
    <div class="cols">
      <div>
        <h4>Pages</h4>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
      <div>
        <h4>Follow</h4>
        <a href="#">Facebook</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </div>
    <div class="bottom">made by Bhargav, 2018</div>
  </footer>
</body>
</html>
