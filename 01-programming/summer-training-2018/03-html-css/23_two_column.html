<!DOCTYPE html>
<html>
<head>
  <title>two column layout</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial; margin: 0; }
    .left {
      float: left;
      width: 30%;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      min-height: 300px;
    }
    .right {
      float: left;
      width: 70%;
      padding: 20px;
      min-height: 300px;
    }
    .left a { color: white; display: block; padding: 5px 0; text-decoration: none; }
    .row:after {
      content: "";
      display: table;
      clear: both;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Cricket Blog</h2>
  <div class="row">
    <div class="left">
      <h3>Menu</h3>
      <a href="#">Home</a>
      <a href="#">Matches</a>
      <a href="#">Players</a>
    </div>
    <div class="right">
      <h3>Latest Match</h3>
      <p>India won the match by 6 wickets. It was a great game and Kohli scored a century.</p>
    </div>
  </div>
</body>
</html>
