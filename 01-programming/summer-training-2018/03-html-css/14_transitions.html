<!DOCTYPE html>
<html>
<head>
  <title>css transitions</title>
  <style>
    .box {
      width: 150px;
      height: 150px;
      background-color: #3498db;
      color: white;
      text-align: center;
      line-height: 150px;
      transition: all 0.4s ease;
    }
    .box:hover {
      background-color: #e74c3c;
      width: 250px;
    }
  </style>
</head>
<body>
  <h2>Hover Transition</h2>
  <div class="box">hover me</div>
</body>
</html>
