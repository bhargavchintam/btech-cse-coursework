<!DOCTYPE html>
<html>
<head>
  <title>flexbox cards</title>
  <style>
    .row {
      display: flex;
      justify-content: space-around;
    }
    .card {
      width: 28%;
      background-color: #eee;
      border: 1px solid #ccc;
      padding: 15px;
      text-align: center;
    }
    .card h3 {
      color: #444;
    }
  </style>
</head>
<body>
  <h2>Our Courses</h2>
  <div class="row">
    <div class="card">
      <h3>HTML</h3>
      <p>Structure of web pages</p>
    </div>
    <div class="card">
      <h3>CSS</h3>
      <p>Styling the web pages</p>
    </div>
    <div class="card">
      <h3>JavaScript</h3>
      <p>Making pages interactive</p>
    </div>
  </div>
</body>
</html>
