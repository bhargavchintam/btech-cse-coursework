<!DOCTYPE html>
<html>
<head>
  <title>css grid</title>
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-gap: 10px;
    }
    .grid div {
      background-color: #8e44ad;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h2>Grid of Movies</h2>
  <div class="grid">
    <div>Sholay</div>
    <div>Dangal</div>
    <div>3 Idiots</div>
    <div>Lagaan</div>
    <div>Sultan</div>
    <div>PK</div>
  </div>
</body>
</html>
