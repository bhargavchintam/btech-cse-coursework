<!DOCTYPE html>
<html>
<head>
    <title>box model</title>
    <style>
        .box1 {
            width: 250px;
            background-color: lightblue;
            border: 3px solid blue;
            padding: 20px;
            margin: 30px;
        }
        .box2 {
            width: 250px;
            background-color: lightyellow;
            border: 5px dashed orange;
            padding: 5px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>Box Model</h2>
    <div class="box1">This box has 20px padding and 30px margin.</div>
    <div class="box2">This box has 5px padding and 10px margin.</div>
</body>
</html>
