<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">Computer Organization and Architecture and Lab</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:#f6f8fa;stroke:#d0d7de}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.accent{fill:#bc4c00}
.chip{fill:#bc4c00;fill-opacity:0.08;stroke:#bc4c00;stroke-opacity:.45}
.deco{fill:none;stroke:#bc4c00;stroke-opacity:.13}
@media (prefers-color-scheme: dark){
.card{fill:#161b22;stroke:#30363d}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.accent{fill:#f0883e}
.chip{fill:#f0883e;fill-opacity:0.14;stroke:#f0883e;stroke-opacity:.5}
.deco{stroke:#f0883e;stroke-opacity:.16}
}
</style>
<defs><clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath></defs>
<rect class="card" x="1" y="1" width="1198" height="298" rx="18" stroke-width="2"/>
<g clip-path="url(#clip)">
<rect class="accent" x="0" y="0" width="12" height="300"/>
<g class="deco" stroke-width="2"><circle cx="1150" cy="300" r="70"/><circle cx="1150" cy="300" r="115"/><circle cx="1150" cy="300" r="160"/><circle cx="1150" cy="300" r="205"/></g>
</g>
<text class="muted" x="64" y="62" font-size="20" font-weight="600" letter-spacing=".3">REVA University · B.Tech CSE · 2018-19</text>
<text class="fg" x="64" y="112" font-size="40" font-weight="700">Computer Organization</text>
<text class="fg" x="64" y="156" font-size="40" font-weight="700">and Architecture and Lab</text>
<text class="accent mono" x="64" y="198" font-size="20" font-weight="500">Verilog (Icarus Verilog) · C99 (gcc, make)</text>
<g font-size="18" font-weight="500">
<rect class="chip" x="64.0" y="222" width="201.2" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="164.6" y="248.5" text-anchor="middle">Booth's algorithm</text>
<rect class="chip" x="277.2" y="222" width="119.2" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="336.8" y="248.5" text-anchor="middle">IEEE 754</text>
<rect class="chip" x="408.4" y="222" width="178.6" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="497.7" y="248.5" text-anchor="middle">Cache mapping</text>
<rect class="chip" x="599.0" y="222" width="123.5" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="660.7" y="248.5" text-anchor="middle">Pipelining</text>
<rect class="chip" x="734.4" y="222" width="279.0" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="873.9" y="248.5" text-anchor="middle">Microprogrammed control</text>
</g>
</svg>
