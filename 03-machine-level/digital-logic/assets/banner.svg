<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">Digital Principles and Logic Design and Lab</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:#f6f8fa;stroke:#d0d7de}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.accent{fill:#bc4c00}
.chip{fill:#bc4c00;fill-opacity:0.08;stroke:#bc4c00;stroke-opacity:.45}
.deco{fill:none;stroke:#bc4c00;stroke-opacity:.13}
@media (prefers-color-scheme: dark){
.card{fill:#161b22;stroke:#30363d}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.accent{fill:#f0883e}
.chip{fill:#f0883e;fill-opacity:0.14;stroke:#f0883e;stroke-opacity:.5}
.deco{stroke:#f0883e;stroke-opacity:.16}
}
</style>
<defs><clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath></defs>
