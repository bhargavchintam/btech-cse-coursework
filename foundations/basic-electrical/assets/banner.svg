<text class="fg" x="64" y="134" font-size="46" font-weight="700">Basic Electrical Engineering and Lab</text>
<text class="accent mono" x="64" y="180" font-size="20" font-weight="500">ngspice · Octave</text>
<g font-size="18" font-weight="500">
<rect class="chip" x="64.0" y="222" width="211.0" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="169.5" y="248.5" text-anchor="middle">Network theorems</text>
<rect class="chip" x="287.0" y="222" width="189.4" height="40" rx="20" stroke-width="1.5"/>
