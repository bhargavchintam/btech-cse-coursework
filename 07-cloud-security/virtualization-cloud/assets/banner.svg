<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
<title id="title">Virtualization and Cloud Computing</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.card{fill:#f6f8fa;stroke:#d0d7de}
.fg{fill:#1f2328}
.muted{fill:#59636e}
.accent{fill:#cf222e}
.chip{fill:#cf222e;fill-opacity:0.08;stroke:#cf222e;stroke-opacity:.45}
.deco{fill:none;stroke:#cf222e;stroke-opacity:.13}
@media (prefers-color-scheme: dark){
.card{fill:#161b22;stroke:#30363d}
.fg{fill:#e6edf3}
.muted{fill:#9198a1}
.accent{fill:#ff7b72}
.chip{fill:#ff7b72;fill-opacity:0.14;stroke:#ff7b72;stroke-opacity:.5}
.deco{stroke:#ff7b72;stroke-opacity:.16}
}
</style>
<defs><clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath></defs>
<rect class="card" x="1" y="1" width="1198" height="298" rx="18" stroke-width="2"/>
<g clip-path="url(#clip)">
<rect class="accent" x="0" y="0" width="12" height="300"/>
<g class="deco" stroke-width="2"><circle cx="1150" cy="300" r="70"/><circle cx="1150" cy="300" r="115"/><circle cx="1150" cy="300" r="160"/><circle cx="1150" cy="300" r="205"/></g>
</g>
<text class="muted" x="64" y="62" font-size="20" font-weight="600" letter-spacing=".3">REVA University · B.Tech CSE · 2020</text>
<text class="fg" x="64" y="134" font-size="46" font-weight="700">Virtualization and Cloud Computing</text>
<text class="accent mono" x="64" y="180" font-size="20" font-weight="500">Docker · Kubernetes · AWS (boto3) · Terraform · Ansible</text>
<g font-size="18" font-weight="500">
<rect class="chip" x="64.0" y="222" width="149.4" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="138.7" y="248.5" text-anchor="middle">Hypervisors</text>
<rect class="chip" x="225.4" y="222" width="203.4" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="327.1" y="248.5" text-anchor="middle">IaaS / PaaS / SaaS</text>
<rect class="chip" x="440.8" y="222" width="136.4" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="509.0" y="248.5" text-anchor="middle">Containers</text>
<rect class="chip" x="589.2" y="222" width="266.0" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="722.3" y="248.5" text-anchor="middle">Cloud storage &amp; security</text>
<rect class="chip" x="867.3" y="222" width="135.4" height="40" rx="20" stroke-width="1.5"/>
<text class="fg" x="935.0" y="248.5" text-anchor="middle">Serverless</text>
</g>
</svg>
